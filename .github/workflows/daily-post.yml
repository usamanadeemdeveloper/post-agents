name: Tech Post (Every 3 Days)

on:
  # Runs every 3 days at 9:00 AM UTC
  schedule:
    - cron: '0 9 */3 * *'

  # Allows you to trigger manually from the GitHub Actions tab anytime
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable verbose debug logging'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  post:
    name: Research & Post
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Enable GitHub Actions step debug logging when triggered manually with debug=true
    # You can also enable it permanently by adding a repo secret: ACTIONS_STEP_DEBUG = true
    env:
      ACTIONS_STEP_DEBUG: ${{ github.event.inputs.debug == 'true' }}
      ACTIONS_RUNNER_DEBUG: ${{ github.event.inputs.debug == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Print environment info
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version:  $(npm --version)"
          echo "Runner OS:    ${{ runner.os }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Debug mode:   ${{ github.event.inputs.debug || 'false' }}"
          echo "---"
          echo "Secrets configured:"
          echo "  ANTHROPIC_API_KEY  → ${{ secrets.ANTHROPIC_API_KEY != '' && '✓ set' || '✗ MISSING' }}"
          echo "  NEWSAPI_KEY        → ${{ secrets.NEWSAPI_KEY != '' && '✓ set' || '✗ not set (optional)' }}"
          echo "  LINKEDIN tokens    → ${{ secrets.LINKEDIN_ACCESS_TOKEN != '' && '✓ set' || '✗ MISSING' }}"
          echo "  TWITTER tokens     → ${{ secrets.TWITTER_APP_KEY != '' && '✓ set' || '✗ not set (optional)' }}"

      - name: Install dependencies
        run: npm ci

      - name: Run post pipeline
        run: npm run trigger
        env:
          NODE_ENV: production
          # Enable Node.js async stack traces for better error details
          NODE_OPTIONS: '--enable-source-maps'
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
