name: Claude Bot

# Triggers whenever someone mentions @claude in:
#   - An issue body or title
#   - A PR comment
#   - A PR review comment
#   - A PR review submission
#
# Claude will read the context, understand the ask, and can:
#   - Fix bugs by pushing commits directly to the branch
#   - Answer questions about the code
#   - Implement requested changes
#   - Investigate and explain issues

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when @claude is actually mentioned — avoids firing on every comment
    if: |
      (github.event_name == 'issue_comment'              && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review'         && contains(github.event.review.body, '@claude'))  ||
      (github.event_name == 'issues'                      && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    permissions:
      contents: write        # push fix commits back to the branch
      pull-requests: write   # comment on PRs
      issues: write          # comment on issues
      id-token: write        # OIDC auth
      actions: read          # read workflow/CI logs for debugging context

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
