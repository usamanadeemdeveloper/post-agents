name: Claude PR Review

# Automatically reviews every PR when it is opened or new commits are pushed.
# Claude posts a review comment with: summary of changes, potential bugs,
# code quality feedback, and suggestions — no @mention needed.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Print trigger info
        run: |
          echo "PR:           #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}"
          echo "Author:       ${{ github.event.pull_request.user.login }}"
          echo "Base branch:  ${{ github.event.pull_request.base.ref }}"
          echo "Head branch:  ${{ github.event.pull_request.head.ref }}"
          echo "---"
          echo "Secrets configured:"
          echo "  ANTHROPIC_API_KEY → ${{ secrets.ANTHROPIC_API_KEY != '' && '✓ set' || '✗ MISSING — review will fail' }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this pull request thoroughly. Provide feedback covering:

            1. Summary — what does this PR do in 2–3 sentences?
            2. Potential bugs — anything that could break at runtime?
            3. Code quality — naming, structure, best practices, TypeScript strictness
            4. Security — any exposed secrets, injection risks, or unsafe patterns
            5. Suggestions — concrete improvements with code examples

            Be direct and specific. If the code looks good, say so.
            Format the response as a markdown PR review comment.
